name: iOS Beta (TestFlight)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # proofport-app depends on three sibling packages from the OpenStoa repo
      # via `file:../openstoa/packages/*` (see package.json / metro.config.js).
      # `npm install` does NOT fail when that sibling is missing — it happily
      # creates a BROKEN symlink pointing at a path that doesn't exist and
      # exits 0 (verified locally: `npm install --legacy-peer-deps` against a
      # bare checkout of this repo alone reports "added 1853 packages" with no
      # warning, while `node_modules/openstoa-mobile` resolves to nothing).
      # The failure was previously deferred to the Metro bundle step inside
      # `pod install`/`fastlane`/`xcodebuild` — much later, and confusing,
      # since `OpenStoaRootScreen.tsx` imports `openstoa-mobile` at the top
      # level (not lazily), so Metro must resolve it to produce any bundle at
      # all. Checking out OpenStoa as a real sibling directory here closes
      # that gap. Pinned to `.openstoa-commit` (not `main`) so a build is
      # reproducible and an OpenStoa change never ships silently — bump that
      # file in the same commit/PR that needs the new OpenStoa code, the same
      # discipline this repo already uses for `CIRCUIT_DATA_VERSION`.
      - uses: actions/checkout@v4
        with:
          path: proofport-app

      # Fails fast on a malformed/unresolvable/rewritten pin, and warns
      # loudly (run summary + ::warning) when the pin is a valid but
      # outdated ancestor of openstoa main — see the action itself for the
      # fail-vs-warn reasoning.
      - name: Check OpenStoa pin staleness
        id: openstoa-pin
        uses: ./proofport-app/.github/actions/openstoa-pin-check
        with:
          pin-file: proofport-app/.openstoa-commit

      - name: Checkout OpenStoa (sibling mini-app source)
        uses: actions/checkout@v4
        with:
          repository: zkproofport/openstoa
          ref: ${{ steps.openstoa-pin.outputs.sha }}
          path: openstoa

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: proofport-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: proofport-app/node_modules
          # Includes the OpenStoa pin: bumping .openstoa-commit must bust this
          # cache, or a stale node_modules could keep a broken/outdated
          # `openstoa-mobile` symlink alive across the change that fixed it.
          key: node-${{ hashFiles('proofport-app/package-lock.json', 'proofport-app/.openstoa-commit') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: proofport-app/ios/Pods
          key: pods-${{ hashFiles('proofport-app/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Download mopro binaries
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release download mopro-binaries-v0.3.2 \
            --repo ${{ github.repository }} \
            --pattern 'MoproFfiFramework.xcframework.tar.gz' \
            --dir /tmp
          tar xzf /tmp/MoproFfiFramework.xcframework.tar.gz -C proofport-app/mopro_bindings/

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: proofport-app
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: cd proofport-app/ios && pod install --repo-update

      - name: Decode App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          echo "$ASC_API_KEY" | base64 -d > /tmp/asc_api_key_pkcs8.p8
          openssl ec -in /tmp/asc_api_key_pkcs8.p8 -out /tmp/asc_api_key.p8 2>/dev/null

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_PATH: /tmp/asc_api_key.p8
          ASC_API_KEY_PKCS8_PATH: /tmp/asc_api_key_pkcs8.p8
          MATCH_GIT_URL: https://${{ secrets.GH_PAT }}@github.com/zkproofport/ios-certificates.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          cd proofport-app/ios
          bundle exec fastlane beta env:staging

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProofportApp-staging.ipa
          path: proofport-app/ios/build/ProofportApp.ipa
