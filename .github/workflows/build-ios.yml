name: iOS Beta (TestFlight)

on:
  workflow_dispatch:

jobs:
  build:
    # xcode-27: the Xcode 27 image (macOS 27, iOS 27 SDK). Apple's ITMS-90725
    # warning on build 23 (2026-11) said uploads built with the iOS 26 SDK
    # stop being accepted in April 2027; GitHub's label is documented at
    # https://github.blog/changelog/2026-10-16-xcode-27-runner-image-generally-available/
    # Before it, macos-26 replaced macos-15 because Apple refused an iOS 18.5
    # SDK upload with validation 409 after a build that had succeeded --
    # an SDK floor shows up only at the upload step.
    runs-on: xcode-27
    # 45, not 30: run 41420053752 (2026-11-02) uploaded build 20 to TestFlight
    # at minute 27, then the node_modules cache save ran past 30 and the run
    # was cancelled -- a red run over a good upload. Earlier runs took 27-29.
    timeout-minutes: 45
    steps:
      # proofport-app depends on three sibling packages from the OpenStoa repo
      # via `file:../openstoa/packages/*` (see package.json / metro.config.js).
      # `npm install` does NOT fail when that sibling is missing — it happily
      # creates a BROKEN symlink pointing at a path that doesn't exist and
      # exits 0 (verified locally: `npm install --legacy-peer-deps` against a
      # bare checkout of this repo alone reports "added 1853 packages" with no
      # warning, while `node_modules/openstoa-mobile` resolves to nothing).
      # The failure was previously deferred to the Metro bundle step inside
      # `pod install`/`fastlane`/`xcodebuild` — much later, and confusing,
      # since `OpenStoaRootScreen.tsx` imports `openstoa-mobile` at the top
      # level (not lazily), so Metro must resolve it to produce any bundle at
      # all. Checking out OpenStoa as a real sibling directory here closes
      # that gap. Pinned to `.openstoa-commit` (not `main`) so a build is
      # reproducible and an OpenStoa change never ships silently — bump that
      # file in the same commit/PR that needs the new OpenStoa code, the same
      # discipline this repo already uses for `CIRCUIT_DATA_VERSION`.
      - uses: actions/checkout@v4
        with:
          path: proofport-app

      # Fails fast on a malformed/unresolvable/rewritten pin, and warns
      # loudly (run summary + ::warning) when the pin is a valid but
      # outdated ancestor of openstoa main — see the action itself for the
      # fail-vs-warn reasoning.
      - name: Check OpenStoa pin staleness
        id: openstoa-pin
        uses: ./proofport-app/.github/actions/openstoa-pin-check
        with:
          pin-file: proofport-app/.openstoa-commit

      - name: Checkout OpenStoa (sibling mini-app source)
        uses: actions/checkout@v4
        with:
          repository: zkproofport/openstoa
          ref: ${{ steps.openstoa-pin.outputs.sha }}
          path: openstoa

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: proofport-app/.ruby-version
          bundler-cache: true
          working-directory: proofport-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: proofport-app/.nvmrc

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          # mopro_bindings/node_modules too: mopro-ffi is `file:./mopro_bindings`
          # and its uniffi-bindgen-react-native lives there; a hit restoring
          # only the app's tree skipped `npm ci` and broke the native build
          # (build-android.yml run 40680985597, 2026-10-28).
          path: |
            proofport-app/node_modules
            proofport-app/mopro_bindings/node_modules
          # Includes the OpenStoa pin: bumping .openstoa-commit must bust this
          # cache, or a stale node_modules could keep a broken/outdated
          # `openstoa-mobile` symlink alive across the change that fixed it.
          key: node-${{ hashFiles('proofport-app/package-lock.json', 'proofport-app/.openstoa-commit', 'proofport-app/mopro_bindings/package.json') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: proofport-app/ios/Pods
          key: pods-${{ hashFiles('proofport-app/ios/Podfile.lock') }}
          restore-keys: pods-

      # The iOS proving library is the one committed in this repository
      # (mopro_bindings/MoproFfiFramework.xcframework, Git LFS), built with
      # the bindings beside it. This step used to unpack the release asset
      # mopro-binaries-v0.3.2 (February 2026) over it, so every archive linked
      # a library older than its bindings; the 1.4.5 archive failed on the
      # three background-prover functions it lacked. LFS objects are cached
      # by their ids, so a build downloads them only when they change.
      - name: List the iOS proving library's LFS objects
        working-directory: proofport-app
        run: git lfs ls-files -l -I 'mopro_bindings/MoproFfiFramework.xcframework/**' | tee ../mopro-lfs-ids.txt

      - name: Cache the iOS proving library
        uses: actions/cache@v4
        with:
          path: proofport-app/.git/lfs
          key: mopro-lfs-${{ hashFiles('mopro-lfs-ids.txt') }}

      - name: Fetch the iOS proving library (Git LFS)
        working-directory: proofport-app
        run: git lfs pull --include 'mopro_bindings/MoproFfiFramework.xcframework/**'

      - name: Check the proving library against its bindings
        working-directory: proofport-app
        run: scripts/check-mopro-ios-symbols.sh

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: proofport-app
        # `npm ci`, not `npm install`. The install here used to ignore the
        # lockfile and re-resolve every caret range, so the build compiled a
        # dependency set nobody had ever tested — and the same commit could
        # build today and fail tomorrow with nothing changed. It did: a newer
        # react-native-screens declares a native command argument as
        # `React.ComponentRef<>`, which this react-native's codegen rejects
        # (it accepts only `React.ElementRef<>`), and pod install died on it
        # while the pinned version in the lockfile was fine. The test workflow
        # already called `npm ci` — and had been failing on every push for the
        # same reason, unnoticed, because the lockfile was gitignored.
        run: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        run: cd proofport-app/ios && bundle exec pod install --repo-update

      - name: Decode App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          echo "$ASC_API_KEY" | base64 -d > /tmp/asc_api_key_pkcs8.p8
          openssl ec -in /tmp/asc_api_key_pkcs8.p8 -out /tmp/asc_api_key.p8 2>/dev/null

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_PATH: /tmp/asc_api_key.p8
          ASC_API_KEY_PKCS8_PATH: /tmp/asc_api_key_pkcs8.p8
          MATCH_GIT_URL: https://${{ secrets.GH_PAT }}@github.com/zkproofport/proofport-app-certificates.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          cd proofport-app/ios
          bundle exec fastlane beta env:staging

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProofportApp-staging.ipa
          path: proofport-app/ios/build/ProofportApp.ipa
