name: Release App

# BUILD AND SHIP A TAG. The version is not calculated here — it is already in
# the code this checks out, put there by bump-version.yml.
#
# STARTED BY A PERSON, ALWAYS. A tag is created for every release-worthy commit
# on main, but shipping to a store is a decision, not a consequence of merging.
# So this takes the tag as an input and is never triggered by the tag's push.
#
# Retrying a failed release is the same act: run it again against the same tag.
# Same code, same numbers, no version burned.
#
# WHY THE VERSION IS NOT COMPUTED HERE. It used to be, in a job above the
# builds, and it published the tag before a byte was built. Every job checks out
# on its own runner and `actions/checkout` takes the commit that STARTED the
# run, so the builds got the code from before the bump: app-v1.1.0 reached Play
# as `version_name 1.0.1` on 2026-09-04. Splitting the two removes the gap
# rather than bridging it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (app-vX.Y.Z). Empty builds the current branch.'
        type: string
        required: false
      dry_run:
        description: 'Dry run (skip upload)'
        type: boolean
        default: true
      platform:
        description: 'Target platform'
        type: choice
        options:
          - both
          - ios
          - android
        default: both
      environment:
        description: 'App environment'
        type: choice
        options:
          - staging
          - production
        default: production
      android_track:
        description: 'Play track the AAB is uploaded to'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: alpha
      android_release_status:
        description: 'Play release status — completed is REFUSED while the app has never been published'
        type: choice
        options:
          - draft
          - completed
        default: draft
      ios_submit_for_review:
        description: 'Also submit the App Store version for review (TestFlight upload happens either way)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# One release at a time, keyed by the thing being released. Two runs against
# DIFFERENT tags may proceed together; two against the same one would race to
# upload the same version code, which the stores reject.
#
# cancel-in-progress is deliberately FALSE. Cancelling halfway can leave one
# store with a build and the other without. Waiting is slower and recoverable.
concurrency:
  group: release-app-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS
    # No `needs`: nothing has to be calculated before this can start.
    #
    # A tag push has no inputs, so `inputs.platform` is empty then — the
    # comparison below treats that as 'both', which is what a tag push means:
    # ship everywhere.
    if: inputs.platform == '' || inputs.platform == 'both' || inputs.platform == 'ios'
    # macos-26, not macos-15. Apple stopped accepting uploads built with an
    # older SDK: the first release to reach the upload step was rejected with
    # "This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps must be
    # built with the iOS 26 SDK or later, included in Xcode 26 or later"
    # (validation 409). macos-15 ships Xcode 16, which is that 18.5 SDK. The
    # build itself took seventeen minutes and succeeded — only Apple's
    # validation refused it, so nothing in the log before that line looks wrong.
    runs-on: macos-26
    steps:
      # See build-ios.yml (the beta workflow) for the full rationale:
      # proofport-app depends on three sibling OpenStoa packages via
      # `file:../openstoa/packages/*`. `npm install` does not fail when that
      # sibling is missing — it creates a broken symlink and exits 0 — so this
      # checkout is required, not optional. This is the PRODUCTION release
      # path; without it, a "successful" release build ships an app whose
      # OpenStoa tab cannot even be bundled (the import is static/eager, not
      # lazy — Metro must resolve it to produce any bundle at all).
      # The tag named on the run, or the branch when none was given. Either way
      # the version is already written into what this checks out — bump-version
      # put it there before making the tag — so nothing here calculates or waits
      # for one.
      #
      # An earlier shape did calculate it, in a job above these, and published
      # the tag before a byte was built. Each job checks out on its own runner
      # and takes the commit that STARTED the run, so the builds got the code
      # from before the bump: app-v1.1.0 reached Play as `version_name 1.0.1` on
      # 2026-09-04.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          path: proofport-app

      # Nothing is written here. The version is already in the files, put there
      # by bump-version.yml before the tag was made — this only reports it, and
      # refuses code that disagrees with itself.
      - name: The version being built
        working-directory: proofport-app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GRADLE=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | grep -oE '[0-9][0-9.]*')
          echo "package.json: $VERSION"
          echo "build.gradle: $GRADLE"
          [ "$VERSION" = "$GRADLE" ] || { echo "::error::checked-out code disagrees with itself: $VERSION vs $GRADLE"; exit 1; }
          echo "building version $VERSION"

      # Fails fast on a malformed/unresolvable/rewritten pin, and warns
      # loudly (run summary + ::warning) when the pin is a valid but
      # outdated ancestor of openstoa main — see the action itself for the
      # fail-vs-warn reasoning.
      - name: Check OpenStoa pin staleness
        id: openstoa-pin
        uses: ./proofport-app/.github/actions/openstoa-pin-check
        with:
          pin-file: proofport-app/.openstoa-commit

      - name: Checkout OpenStoa (sibling mini-app source)
        uses: actions/checkout@v4
        with:
          repository: zkproofport/openstoa
          ref: ${{ steps.openstoa-pin.outputs.sha }}
          path: openstoa

      - uses: actions/setup-node@v4
        with:
          node-version-file: proofport-app/.nvmrc

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: proofport-app/.ruby-version
          bundler-cache: true
          working-directory: proofport-app

      - name: Cache node_modules
        id: cache-node-ios
        uses: actions/cache@v4
        with:
          path: proofport-app/node_modules
          # Includes the OpenStoa pin: bumping .openstoa-commit must bust this
          # cache, or a stale node_modules could keep a broken/outdated
          # `openstoa-mobile` symlink alive across the change that fixed it.
          key: node-${{ hashFiles('proofport-app/package-lock.json', 'proofport-app/.openstoa-commit') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: proofport-app/ios/Pods
          key: pods-${{ hashFiles('proofport-app/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Download mopro binaries
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release download mopro-binaries-v0.3.2 \
            --repo ${{ github.repository }} \
            --pattern 'MoproFfiFramework.xcframework.tar.gz' \
            --dir /tmp
          tar xzf /tmp/MoproFfiFramework.xcframework.tar.gz -C proofport-app/mopro_bindings/

      - name: Install dependencies
        if: steps.cache-node-ios.outputs.cache-hit != 'true'
        working-directory: proofport-app
        # `npm ci`, not `npm install`. The install here used to ignore the
        # lockfile and re-resolve every caret range, so the build compiled a
        # dependency set nobody had ever tested — and the same commit could
        # build today and fail tomorrow with nothing changed. It did: a newer
        # react-native-screens declares a native command argument as
        # `React.ComponentRef<>`, which this react-native's codegen rejects
        # (it accepts only `React.ElementRef<>`), and pod install died on it
        # while the pinned version in the lockfile was fine. The test workflow
        # already called `npm ci` — and had been failing on every push for the
        # same reason, unnoticed, because the lockfile was gitignored.
        run: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        run: cd proofport-app/ios && bundle exec pod install --repo-update

      - name: Decode App Store Connect API key
        if: inputs.dry_run == false
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          echo "$ASC_API_KEY" | base64 -d > /tmp/asc_api_key_pkcs8.p8
          openssl ec -in /tmp/asc_api_key_pkcs8.p8 -out /tmp/asc_api_key.p8 2>/dev/null

      - name: Build and upload to TestFlight
        if: inputs.dry_run == false
        working-directory: proofport-app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_PATH: /tmp/asc_api_key.p8
          ASC_API_KEY_PKCS8_PATH: /tmp/asc_api_key_pkcs8.p8
          MATCH_GIT_URL: https://${{ secrets.GH_PAT }}@github.com/zkproofport/proofport-app-certificates.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        # The lane always uploads to TestFlight. It asks Apple for review only
        # when told to, and then it waits for the build to finish processing
        # first, which adds several minutes to the run.
        run: bundle exec fastlane ios beta env:${{ inputs.environment }} submit_for_review:${{ inputs.ios_submit_for_review }}

      - name: Build only (dry run)
        if: inputs.dry_run == true
        working-directory: proofport-app/ios
        env:
          APP_ENV: production
        run: |
          xcodebuild -workspace ProofportApp.xcworkspace \
            -scheme ProofportApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            APP_ENV=$APP_ENV \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload IPA artifact
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: ProofportApp.ipa
          path: proofport-app/ios/build/ProofportApp.ipa

  build-android:
    name: Build Android
    if: inputs.platform == '' || inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      # See build-ios job above / build-android.yml (beta workflow) for the
      # full rationale: proofport-app depends on three sibling OpenStoa
      # packages via `file:../openstoa/packages/*`, and `npm install` does
      # not fail when that sibling is missing — it creates a broken symlink
      # and exits 0.
      # The tag named on the run, or the branch when none was given. Either way
      # the version is already written into what this checks out — bump-version
      # put it there before making the tag — so nothing here calculates or waits
      # for one.
      #
      # An earlier shape did calculate it, in a job above these, and published
      # the tag before a byte was built. Each job checks out on its own runner
      # and takes the commit that STARTED the run, so the builds got the code
      # from before the bump: app-v1.1.0 reached Play as `version_name 1.0.1` on
      # 2026-09-04.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          path: proofport-app

      # Nothing is written here. The version is already in the files, put there
      # by bump-version.yml before the tag was made — this only reports it, and
      # refuses code that disagrees with itself.
      - name: The version being built
        working-directory: proofport-app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GRADLE=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | grep -oE '[0-9][0-9.]*')
          echo "package.json: $VERSION"
          echo "build.gradle: $GRADLE"
          [ "$VERSION" = "$GRADLE" ] || { echo "::error::checked-out code disagrees with itself: $VERSION vs $GRADLE"; exit 1; }
          echo "building version $VERSION"

      # Fails fast on a malformed/unresolvable/rewritten pin, and warns
      # loudly (run summary + ::warning) when the pin is a valid but
      # outdated ancestor of openstoa main — see the action itself for the
      # fail-vs-warn reasoning.
      - name: Check OpenStoa pin staleness
        id: openstoa-pin
        uses: ./proofport-app/.github/actions/openstoa-pin-check
        with:
          pin-file: proofport-app/.openstoa-commit

      - name: Checkout OpenStoa (sibling mini-app source)
        uses: actions/checkout@v4
        with:
          repository: zkproofport/openstoa
          ref: ${{ steps.openstoa-pin.outputs.sha }}
          path: openstoa

      - uses: actions/setup-node@v4
        with:
          node-version-file: proofport-app/.nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: proofport-app/.ruby-version
          bundler-cache: true
          working-directory: proofport-app

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            proofport-app/android/.gradle
          key: gradle-${{ hashFiles('proofport-app/android/gradle/wrapper/gradle-wrapper.properties', 'proofport-app/android/app/build.gradle', 'proofport-app/android/build.gradle') }}
          restore-keys: gradle-

      - name: Cache node_modules
        id: cache-node-android
        uses: actions/cache@v4
        with:
          path: proofport-app/node_modules
          # Includes the OpenStoa pin: bumping .openstoa-commit must bust this
          # cache, or a stale node_modules could keep a broken/outdated
          # `openstoa-mobile` symlink alive across the change that fixed it.
          key: node-${{ hashFiles('proofport-app/package-lock.json', 'proofport-app/.openstoa-commit') }}

      - name: Decode keystore
        if: inputs.dry_run == false
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > proofport-app/android/app/release.keystore

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          df -h /

      - name: Install dependencies
        if: steps.cache-node-android.outputs.cache-hit != 'true'
        working-directory: proofport-app
        # `npm ci`, not `npm install`. The install here used to ignore the
        # lockfile and re-resolve every caret range, so the build compiled a
        # dependency set nobody had ever tested — and the same commit could
        # build today and fail tomorrow with nothing changed. It did: a newer
        # react-native-screens declares a native command argument as
        # `React.ComponentRef<>`, which this react-native's codegen rejects
        # (it accepts only `React.ElementRef<>`), and pod install died on it
        # while the pinned version in the lockfile was fine. The test workflow
        # already called `npm ci` — and had been failing on every push for the
        # same reason, unnoticed, because the lockfile was gitignored.
        run: npm ci --legacy-peer-deps

      - name: Build AAB
        if: inputs.dry_run == false
        working-directory: proofport-app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/proofport-app/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          # The Play service-account JSON itself, not a path to it — see the
          # branch comment in android/fastlane/Fastfile. Until this secret
          # exists the lane builds and signs the AAB, says out loud that it
          # uploaded nothing, and the artifact step below still keeps the file.
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android beta flavor:${{ inputs.environment }} track:${{ inputs.android_track }} release_status:${{ inputs.android_release_status }}

      - name: Build APK (dry run)
        if: inputs.dry_run == true
        working-directory: proofport-app/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleProductionRelease

      - name: Upload AAB artifact
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release.aab
          path: proofport-app/android/app/build/outputs/bundle/productionRelease/*.aab

      - name: Upload APK artifact
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release.apk
          path: proofport-app/android/app/build/outputs/apk/production/release/*.apk
