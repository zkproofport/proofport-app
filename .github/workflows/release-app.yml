name: Release App

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip upload)'
        type: boolean
        default: true
      platform:
        description: 'Target platform'
        type: choice
        options:
          - both
          - ios
          - android
        default: both
      environment:
        description: 'App environment'
        type: choice
        options:
          - staging
          - production
        required: true
      skip_version:
        description: 'Skip version calculation and ship the version already in package.json'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.pinned.outputs.new_release_version || steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.pinned.outputs.new_release_published || steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        if: inputs.skip_version == false
        run: npm install --no-save --legacy-peer-deps semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec

      # Shipping the version that is already in the tree, not a computed one.
      #
      # semantic-release derives the next version from the tags, and it can
      # never re-emit a version that already has a tag. So when the store is
      # waiting on a version number that is behind the tag history — the first
      # submission on a new Apple account, a resubmission, a hotfix pinned to a
      # published version — the only way to make the calculator agree would be
      # to delete every tag and every GitHub release. This input exists so that
      # is never the price: no tag is written, no CHANGELOG entry is made, and
      # the build carries the version already committed in package.json.
      #
      # Nothing downstream changes: the outputs below have the same shape the
      # semantic-release step produces, so the platform jobs cannot tell the
      # difference.
      - name: Use the committed version
        id: pinned
        if: inputs.skip_version == true
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "package.json has no version to ship" >&2
            exit 1
          fi
          echo "Shipping the committed version $VERSION — no tag, no changelog entry."
          echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new_release_published=true" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        id: semantic
        if: inputs.skip_version == false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run 2>&1 | tee sr-output.txt
          else
            npx semantic-release 2>&1 | tee sr-output.txt
          fi
          VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' sr-output.txt || echo "")
          echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new_release_published=$( [ -n \"$VERSION\" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Version summary
        run: |
          echo "## Version" >> "$GITHUB_STEP_SUMMARY"
          echo "- New version: ${{ steps.pinned.outputs.new_release_version || steps.semantic.outputs.new_release_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: ${{ steps.pinned.outputs.new_release_published || steps.semantic.outputs.new_release_published }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version calculation skipped: ${{ inputs.skip_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: ${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build iOS
    needs: version
    if: |
      needs.version.outputs.new_release_published == 'true' &&
      (inputs.platform == 'both' || inputs.platform == 'ios')
    runs-on: macos-15
    steps:
      # See build-ios.yml (the beta workflow) for the full rationale:
      # proofport-app depends on three sibling OpenStoa packages via
      # `file:../openstoa/packages/*`. `npm install` does not fail when that
      # sibling is missing — it creates a broken symlink and exits 0 — so this
      # checkout is required, not optional. This is the PRODUCTION release
      # path; without it, a "successful" release build ships an app whose
      # OpenStoa tab cannot even be bundled (the import is static/eager, not
      # lazy — Metro must resolve it to produce any bundle at all).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          path: proofport-app

      # Fails fast on a malformed/unresolvable/rewritten pin, and warns
      # loudly (run summary + ::warning) when the pin is a valid but
      # outdated ancestor of openstoa main — see the action itself for the
      # fail-vs-warn reasoning.
      - name: Check OpenStoa pin staleness
        id: openstoa-pin
        uses: ./proofport-app/.github/actions/openstoa-pin-check
        with:
          pin-file: proofport-app/.openstoa-commit

      - name: Checkout OpenStoa (sibling mini-app source)
        uses: actions/checkout@v4
        with:
          repository: zkproofport/openstoa
          ref: ${{ steps.openstoa-pin.outputs.sha }}
          path: openstoa

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: proofport-app

      - name: Cache node_modules
        id: cache-node-ios
        uses: actions/cache@v4
        with:
          path: proofport-app/node_modules
          # Includes the OpenStoa pin: bumping .openstoa-commit must bust this
          # cache, or a stale node_modules could keep a broken/outdated
          # `openstoa-mobile` symlink alive across the change that fixed it.
          key: node-${{ hashFiles('proofport-app/package-lock.json', 'proofport-app/.openstoa-commit') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: proofport-app/ios/Pods
          key: pods-${{ hashFiles('proofport-app/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Download mopro binaries
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release download mopro-binaries-v0.3.2 \
            --pattern 'MoproFfiFramework.xcframework.tar.gz' \
            --dir /tmp
          tar xzf /tmp/MoproFfiFramework.xcframework.tar.gz -C proofport-app/mopro_bindings/

      - name: Install dependencies
        if: steps.cache-node-ios.outputs.cache-hit != 'true'
        working-directory: proofport-app
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: cd proofport-app/ios && pod install --repo-update

      - name: Decode App Store Connect API key
        if: inputs.dry_run == false
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          echo "$ASC_API_KEY" | base64 -d > /tmp/asc_api_key_pkcs8.p8
          openssl ec -in /tmp/asc_api_key_pkcs8.p8 -out /tmp/asc_api_key.p8 2>/dev/null

      - name: Build and upload to TestFlight
        if: inputs.dry_run == false
        working-directory: proofport-app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_PATH: /tmp/asc_api_key.p8
          ASC_API_KEY_PKCS8_PATH: /tmp/asc_api_key_pkcs8.p8
          MATCH_GIT_URL: https://${{ secrets.GH_PAT }}@github.com/zkproofport/ios-certificates.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta env:${{ inputs.environment }}

      - name: Build only (dry run)
        if: inputs.dry_run == true
        working-directory: proofport-app/ios
        env:
          APP_ENV: production
        run: |
          xcodebuild -workspace ProofportApp.xcworkspace \
            -scheme ProofportApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            APP_ENV=$APP_ENV \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload IPA artifact
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: ProofportApp.ipa
          path: proofport-app/ios/build/ProofportApp.ipa

  build-android:
    name: Build Android
    needs: version
    if: |
      needs.version.outputs.new_release_published == 'true' &&
      (inputs.platform == 'both' || inputs.platform == 'android')
    runs-on: ubuntu-latest
    steps:
      # See build-ios job above / build-android.yml (beta workflow) for the
      # full rationale: proofport-app depends on three sibling OpenStoa
      # packages via `file:../openstoa/packages/*`, and `npm install` does
      # not fail when that sibling is missing — it creates a broken symlink
      # and exits 0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          path: proofport-app

      # Fails fast on a malformed/unresolvable/rewritten pin, and warns
      # loudly (run summary + ::warning) when the pin is a valid but
      # outdated ancestor of openstoa main — see the action itself for the
      # fail-vs-warn reasoning.
      - name: Check OpenStoa pin staleness
        id: openstoa-pin
        uses: ./proofport-app/.github/actions/openstoa-pin-check
        with:
          pin-file: proofport-app/.openstoa-commit

      - name: Checkout OpenStoa (sibling mini-app source)
        uses: actions/checkout@v4
        with:
          repository: zkproofport/openstoa
          ref: ${{ steps.openstoa-pin.outputs.sha }}
          path: openstoa

      - name: Authenticate to Google Cloud
        if: inputs.dry_run == false
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/995938448974/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@zkproofport.iam.gserviceaccount.com'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: proofport-app

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            proofport-app/android/.gradle
          key: gradle-${{ hashFiles('proofport-app/android/gradle/wrapper/gradle-wrapper.properties', 'proofport-app/android/app/build.gradle', 'proofport-app/android/build.gradle') }}
          restore-keys: gradle-

      - name: Cache node_modules
        id: cache-node-android
        uses: actions/cache@v4
        with:
          path: proofport-app/node_modules
          # Includes the OpenStoa pin: bumping .openstoa-commit must bust this
          # cache, or a stale node_modules could keep a broken/outdated
          # `openstoa-mobile` symlink alive across the change that fixed it.
          key: node-${{ hashFiles('proofport-app/package-lock.json', 'proofport-app/.openstoa-commit') }}

      - name: Decode keystore
        if: inputs.dry_run == false
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > proofport-app/android/app/release.keystore

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          df -h /

      - name: Download mopro binaries
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release download mopro-binaries-v0.3.2 \
            --pattern 'android-jniLibs-arm64-v8a.tar.gz' \
            --dir /tmp
          mkdir -p proofport-app/mopro_bindings/android/src/main/jniLibs
          tar xzf /tmp/android-jniLibs-arm64-v8a.tar.gz -C proofport-app/mopro_bindings/android/src/main/jniLibs/
          rm /tmp/android-jniLibs-arm64-v8a.tar.gz

      - name: Install dependencies
        if: steps.cache-node-android.outputs.cache-hit != 'true'
        working-directory: proofport-app
        run: npm install --legacy-peer-deps

      - name: Build AAB
        if: inputs.dry_run == false
        working-directory: proofport-app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/proofport-app/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          # The Play service-account JSON itself, not a path to it — see the
          # branch comment in android/fastlane/Fastfile. Until this secret
          # exists the lane builds and signs the AAB, says out loud that it
          # uploaded nothing, and the artifact step below still keeps the file.
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android beta flavor:${{ inputs.environment }}

      - name: Build APK (dry run)
        if: inputs.dry_run == true
        working-directory: proofport-app/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleProductionRelease

      - name: Upload AAB artifact
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release.aab
          path: proofport-app/android/app/build/outputs/bundle/productionRelease/*.aab

      - name: Upload APK artifact
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release.apk
          path: proofport-app/android/app/build/outputs/apk/production/release/*.apk
