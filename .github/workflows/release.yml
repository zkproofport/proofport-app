name: Release

# ONE RUN, TWO HALVES: decide the version and tag it, then build that tag and
# ship it. They show up as a single entry in the Actions list, so "did the
# release go out" is one thing to look at rather than two.
#
# It runs semantic-release, which reads the commits, decides the next version,
# writes it into package.json / build.gradle / the Xcode project through
# scripts/sync-version.js, commits that as `chore(release): X.Y.Z` and pushes
# the tag `app-vX.Y.Z`.
#
# The tag is handed to release-app.yml as the second half of this same run.
# What it gives that half is a version already written into the code it checks
# out — nothing to calculate, hand over, or wait for.
#
# WHY THIS IS A SEPARATE WORKFLOW. The two used to be one, with the version job
# publishing the tag before anything was built. Every job checks out on its own
# runner and `actions/checkout` takes the commit that STARTED the run, so the
# builds took the code from before the bump and shipped the previous version's
# numbers — app-v1.1.0 reached Play as `version_name 1.0.1` on 2026-09-04.
#
# Splitting them removes the gap rather than bridging it. It also means a failed
# build costs no version: the tag already exists, so re-running release-app.yml
# against the same tag produces the same binary instead of burning a number.

# STARTED BY A PERSON. The version is decided automatically once this runs —
# nobody picks a number — but whether a build reaches a store is a decision, and
# merging to main is not that decision.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Say what the next version would be, tag nothing, build nothing'
        type: boolean
        default: false
      platform:
        description: 'Target platform'
        type: choice
        options:
          - both
          - ios
          - android
        default: both
      environment:
        description: 'App environment'
        type: choice
        options:
          - staging
          - production
        default: production
      android_track:
        description: 'Play track the AAB is uploaded to'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      android_release_status:
        description: 'Play release status — completed publishes without a console click'
        type: choice
        options:
          - completed
          - draft
        default: completed
      ios_submit_for_review:
        description: 'Also submit the App Store version for review (TestFlight upload happens either way)'
        type: boolean
        default: false

# One version bump at a time. Two running together both read the same tags,
# both decide the same next version, and the second push is rejected as
# out of date.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    name: Bump and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install semantic-release
        run: npm install --no-save --legacy-peer-deps semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run 2>&1 | tee sr-output.txt
          else
            npx semantic-release 2>&1 | tee sr-output.txt
          fi
          VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' sr-output.txt || echo "")
          if [ -z "$VERSION" ]; then
            echo "No release is due — nothing in the commits calls for a version bump."
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION" >> "$GITHUB_OUTPUT"

      # The tag has to be readable by the next workflow, and semantic-release
      # reports success from its own exit code. Reading it back is the only
      # thing that says the push actually landed.
      - name: The tag must exist and carry the version
        if: inputs.dry_run == false && steps.release.outputs.version != ''
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          git fetch --tags --quiet origin
          git rev-parse "$TAG" >/dev/null 2>&1 || { echo "::error::$TAG was not pushed"; exit 1; }
          WROTE=$(git show "$TAG:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          [ "$WROTE" = "${{ steps.release.outputs.version }}" ] || {
            echo "::error::$TAG carries package.json $WROTE, expected ${{ steps.release.outputs.version }}"
            exit 1
          }
          echo "$TAG exists and carries version $WROTE"

      - name: Summary
        run: |
          echo "## Version" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${{ steps.release.outputs.version }}" ]; then
            echo "- No release was due." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "- Would be: ${{ steps.release.outputs.version }} (dry run — nothing written)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Tagged: ${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Building and shipping that tag now, in this same run." >> "$GITHUB_STEP_SUMMARY"
          fi

  # THE SECOND HALF OF THE SAME RUN.
  #
  # `uses:` calls release-app.yml as a reusable workflow, so its jobs appear
  # inside this run rather than as a separate one. Handing it the tag that was
  # just made is what makes this a pipeline instead of two things a person has
  # to remember to do in order.
  #
  # Skipped on a dry run, and skipped when semantic-release found nothing to
  # release — there is no tag to build in either case.
  ship:
    name: Build and ship the tag
    needs: bump
    if: inputs.dry_run == false && needs.bump.outputs.tag != ''
    uses: ./.github/workflows/release-app.yml
    secrets: inherit
    with:
      tag: ${{ needs.bump.outputs.tag }}
      dry_run: false
      platform: ${{ inputs.platform }}
      environment: ${{ inputs.environment }}
      android_track: ${{ inputs.android_track }}
      android_release_status: ${{ inputs.android_release_status }}
      ios_submit_for_review: ${{ inputs.ios_submit_for_review }}
