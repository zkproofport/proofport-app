name: Upload the Play store listing

# The store text only. No build is produced and none is uploaded, so this can
# never cut a release on any track — the script it calls talks to the Play
# listings API and never touches a track or a release at all.
#
# It is a separate workflow, and manual, for the same reason the build lane
# skips metadata: shipping a build must not rewrite the store page, and
# rewriting the store page must not need a build.
#
# This used to call `fastlane supply`, which cannot do the job: supply looks up
# a track release before it will write any listing, and this app has none. See
# the header of android/play/upload-listing.py for the full diagnosis.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only — say what would change, change nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload:
    name: Upload the listing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.masselabs.zkproofport
          METADATA_PATH: fastlane/metadata/android
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 play/upload-listing.py
