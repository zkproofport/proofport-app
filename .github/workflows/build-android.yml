name: Android Beta (Play Console)

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: 'App environment config (development or production)'
        type: choice
        options:
          - development
          - production
        default: development

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # See build-ios.yml for the full rationale: proofport-app depends on
      # three sibling OpenStoa packages via `file:../openstoa/packages/*`.
      # `npm install` does not fail when that sibling is missing — it creates
      # a broken symlink and exits 0 — so this checkout is required, not
      # optional, and its absence would previously have surfaced only much
      # later as a Metro "Unable to resolve module 'openstoa-mobile'" error
      # inside the Gradle/Metro bundle step.
      - uses: actions/checkout@v4
        with:
          path: proofport-app

      # Fails fast on a malformed/unresolvable/rewritten pin, and warns
      # loudly (run summary + ::warning) when the pin is a valid but
      # outdated ancestor of openstoa main — see the action itself for the
      # fail-vs-warn reasoning.
      - name: Check OpenStoa pin staleness
        id: openstoa-pin
        uses: ./proofport-app/.github/actions/openstoa-pin-check
        with:
          pin-file: proofport-app/.openstoa-commit

      - name: Checkout OpenStoa (sibling mini-app source)
        uses: actions/checkout@v4
        with:
          repository: zkproofport/openstoa
          ref: ${{ steps.openstoa-pin.outputs.sha }}
          path: openstoa

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: proofport-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: proofport-app/.nvmrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            proofport-app/android/.gradle
          key: gradle-${{ hashFiles('proofport-app/android/gradle/wrapper/gradle-wrapper.properties', 'proofport-app/android/app/build.gradle', 'proofport-app/android/build.gradle') }}
          restore-keys: gradle-

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: proofport-app/node_modules
          # Includes the OpenStoa pin: bumping .openstoa-commit must bust this
          # cache, or a stale node_modules could keep a broken/outdated
          # `openstoa-mobile` symlink alive across the change that fixed it.
          key: node-${{ hashFiles('proofport-app/package-lock.json', 'proofport-app/.openstoa-commit') }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          df -h /

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: proofport-app
        # `npm ci`, not `npm install`. The install here used to ignore the
        # lockfile and re-resolve every caret range, so the build compiled a
        # dependency set nobody had ever tested — and the same commit could
        # build today and fail tomorrow with nothing changed. It did: a newer
        # react-native-screens declares a native command argument as
        # `React.ComponentRef<>`, which this react-native's codegen rejects
        # (it accepts only `React.ElementRef<>`), and pod install died on it
        # while the pinned version in the lockfile was fine. The test workflow
        # already called `npm ci` — and had been failing on every push for the
        # same reason, unnoticed, because the lockfile was gitignored.
        run: npm ci --legacy-peer-deps

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/zkproofport-release.keystore

      - name: Build AAB
        env:
          ANDROID_KEYSTORE_FILE: /tmp/zkproofport-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          ORG_GRADLE_PROJECT_APP_ENV_OVERRIDE: ${{ inputs.app_env }}
        run: |
          cd proofport-app/android
          bundle exec fastlane beta flavor:staging

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-release.aab
          path: proofport-app/android/app/build/outputs/bundle/stagingRelease/*.aab
