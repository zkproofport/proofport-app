[package]
name = "oprf-wire-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
taceo-oprf-core = { version = "=0.6.3", default-features = false, features = ["server"] }
taceo-oprf-types = { version = "=0.16.2", default-features = false }
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.6" }
ark-ec = "0.6"
ark-ff = "0.6"
rand = "0.8"
rand_chacha = "0.3"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
