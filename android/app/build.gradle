apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Reads android/app/google-services.json (Firebase project zkproofport-93ffd) and
// emits the FCM resources consumed by firebase-messaging. Required for Android push.
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    debuggableVariants = ["developmentDebug", "stagingDebug", "productionDebug"]

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', {paths: [require.resolve('expo/package.json')]})"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Version of the installed `expo-notifications` npm package. Expo SDK 54 resolves its
 * modules as prebuilt Maven artifacts (`host.exp.exponent:expo.modules.<name>`) whose
 * version always equals the npm version, so reading package.json keeps the explicit
 * app-level dependency in lockstep with autolinking.
 */
def resolveExpoNotificationsVersion() {
    def packageJson = file("../../node_modules/expo-notifications/package.json")
    if (!packageJson.exists()) {
        throw new GradleException(
            "expo-notifications is not installed at ${packageJson}. " +
            "Run `npm install` before building the Android app."
        )
    }
    return new groovy.json.JsonSlurper().parse(packageJson).version
}

/**
 * The cross-implementation known-answer vectors for the OpenStoa TAK archive layer,
 * sealed by the TypeScript `sealArchive` / `sealPushPreview`
 * (`openstoa/scripts/gen-archive-vectors.ts`). Shared verbatim with the iOS port so
 * both platforms are checked against the same bytes.
 */
def openStoaArchiveVectors = file("../../ios/scripts/archive_vectors.json")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.masselabs.zkproofport"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    defaultConfig {
        applicationId "com.masselabs.zkproofport"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Reset for the Masse Labs 1.0.0 listing. The old `+ 2000` offset existed
        // to clear the personal-account listing's existing codes; the corporate
        // Play listing is brand new and has no history to climb over, so the
        // offset would only ship 1.0.0 as build 2001 for no reason.
        // Still driven by BUILD_NUMBER (CI passes github.run_number) because Play
        // rejects a versionCode that does not strictly increase — a hardcoded
        // constant would make the second upload impossible.
        versionCode System.getenv("BUILD_NUMBER") ? System.getenv("BUILD_NUMBER").toInteger() : 1
        versionName "1.6.0"
        manifestPlaceholders = [appAuthRedirectScheme: "msalcd5404cc-d313-431c-8112-725e629dad28"]
    }
    flavorDimensions = ["environment"]
    // All flavors share the same applicationId (`com.masselabs.zkproofport`) so
    // there is a single Google OAuth Android client / single Play Console
    // listing across dev / staging / production. Differentiation between
    // environments is carried by app_env (and the visible app_name) rather
    // than by package suffix.
    // `openstoa_enabled` travels the same road as `app_env` — flavor → string
    // resource → AppEnvModule → JS. It used to be a constant in
    // `src/config/features.ts`, so shipping an Android build without the mini-app
    // meant editing source, building, and remembering to put it back. Forgetting
    // that step silently changed the NEXT build of the other platform.
    productFlavors {
        development {
            dimension "environment"
            resValue "string", "app_name", "ZKProofport DEV"
            resValue "string", "app_env", "development"
            resValue "string", "openstoa_enabled", "true"
        }
        staging {
            dimension "environment"
            resValue "string", "app_name", "ZKProofport STG"
            resValue "string", "app_env", "staging"
            resValue "string", "openstoa_enabled", "false"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "ZKProofport"
            resValue "string", "app_env", "production"
            resValue "string", "openstoa_enabled", "false"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Android 12+ Splash Screen API
    implementation("androidx.core:core-splashscreen:1.0.1")

    // --- OpenStoa Android push (FCM) ---
    // expo-notifications already pulls firebase-messaging, but only onto the RUNTIME
    // classpath (it is an `implementation` dep of the expo.modules.notifications AAR),
    // so OpenStoaMessagingService cannot compile against it. Declared here at the exact
    // version expo-notifications resolves, to avoid introducing any version skew.
    implementation("com.google.firebase:firebase-messaging:24.0.1")
    // OpenStoaMessagingService subclasses expo-notifications' ExpoFirebaseMessagingService
    // so Expo push keeps working alongside the OpenStoa data-message path. The version is
    // read from the installed npm package so it can never drift from what autolinking
    // resolves; a missing package is a hard error rather than a silent fallback.
    implementation("host.exp.exponent:expo.modules.notifications:${resolveExpoNotificationsVersion()}")
    // Keystore-encrypted SharedPreferences for OpenStoaTakStore — the Topic Archive
    // Keys the FCM handler needs to decrypt push previews. NOTE: androidx.security
    // was deprecated in April 2025 at 1.1.0-alpha07; alpha06 is pinned deliberately
    // as the last release before the deprecation annotations. The stored data is a
    // regenerable cache (a lost key only costs the preview, never a message), so the
    // library being unmaintained is a maintenance concern, not a correctness one.
    implementation("androidx.security:security-crypto:1.1.0-alpha06")

    // JVM unit tests for the OpenStoa push crypto/payload logic (:app:test*UnitTest).
    testImplementation("junit:junit:4.13.2")
    // Real org.json on the unit-test classpath. Without it every org.json call hits
    // android.jar's "not mocked" stub and the payload tests fail for the wrong reason.
    testImplementation("org.json:json:20250107")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * Make the shared archive vectors a declared INPUT of every unit-test task.
 *
 * Without this Gradle only tracks sources and the classpath, so regenerating
 * `archive_vectors.json` leaves the task UP-TO-DATE and the run is silently
 * skipped — the vectors change, the suite reports green, and nothing was actually
 * re-checked. Declaring the file both invalidates the task on a content change and
 * hands the test its exact path (`OpenStoaArchiveVectorsTest.VECTOR_PATH_PROPERTY`),
 * so the build and the test cannot disagree about which file is under test.
 *
 * `inputs.file` (not `inputs.files`) on purpose: a wrong path must fail loudly
 * rather than degrade to tracking nothing, which is the bug this fixes.
 * `PathSensitivity.NONE` because only the CONTENT matters — a checkout at a
 * different absolute path must still hit the build cache.
 */
tasks.withType(Test).configureEach {
    inputs.file(openStoaArchiveVectors)
        .withPropertyName("openStoaArchiveVectors")
        .withPathSensitivity(PathSensitivity.NONE)
    systemProperty "openstoa.archiveVectors", openStoaArchiveVectors.absolutePath
}

// Fix Gradle 9 implicit task dependency validation for React Native + product flavors.
// RN's createBundle*JsAndAssets tasks use outputs from other tasks without declaring dependencies.
afterEvaluate {
    tasks.matching { it.name.matches(/createBundle.*JsAndAssets/) }.configureEach { bundleTask ->
        def globalDeps = ["generateReactNativeEntryPoint", "generateAutolinkingPackageList", "generateAutolinkingNewArchitectureFiles"]
        globalDeps.each { name ->
            def t = tasks.findByName(name)
            if (t != null) bundleTask.dependsOn(t)
        }

        def matcher = (bundleTask.name =~ /createBundle(.+)JsAndAssets/)
        if (matcher.matches()) {
            def variant = matcher.group(1)
            def variantDeps = [
                "generate${variant}BuildConfig", "check${variant}AarMetadata",
                "check${variant}DuplicateClasses", "merge${variant}JniLibFolders",
                "merge${variant}NativeLibs", "extract${variant}NativeSymbolTables",
                "strip${variant}DebugSymbols", "merge${variant}NativeDebugMetadata",
                "buildKotlinToolingMetadata"
            ]
            variantDeps.each { name ->
                def t = tasks.findByName(name)
                if (t != null) bundleTask.dependsOn(t)
            }
            tasks.matching { it.name.matches(/configureCMake.*/) || it.name.matches(/buildCMake.*/) }.each { t ->
                bundleTask.dependsOn(t)
            }
        }
    }
}
